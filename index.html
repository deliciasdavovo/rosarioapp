#beadsContainer, #beadsContainer * {

      .fade-transition {
        transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
      }
      .fade-out {
        opacity: 0;
        transform: translateY(-8px);
        filter: blur(2px);
      }
      .fade-in {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
      @keyframes ptr-spin {
        to { transform: rotate(360deg); }
      }
      #ptr {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translate(-50%, -48px);
        opacity: 0;
        z-index: 200;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #ptr.ptr-show {
        transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
        transform: translate(-50%, 10px);
        opacity: 1;
      }
      #ptr-ring {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 14px 7px 10px;
        background: #FAF6EE;
        border: 1px solid #E9DFCB;
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(30,20,10,0.12);

        height: 14px;
        border: 2px solid rgba(234,88,12,0.2);
        border-top-color: #ea580c;
        border-radius: 50%;
        flex-shrink: 0;
      }
      #ptr-spinner.spinning {
        animation: ptr-spin 0.7s linear infinite;
      }

          }
        ]
      };

      function getFatimaAveText(m, i) {
        if (i < 3) return m.scripture;
        if (i < 6) return m.reflexao;
        if (i < 8) return m.perguntas[0] + '\n\n' + m.perguntas[1];
        return m.oracao;
      }

      function getMysterySetIdForDay(dayIndex) {
        switch (dayIndex) {
          case 0: return 'gloriosos'; // Domingo
          case 1: return 'gozosos';    // Segunda
          case 2: return 'dolorosos';  // Terça
          case 3: return 'gloriosos';  // Quarta
          case 4: return 'luminosos';  // Quinta
          case 5: return 'dolorosos';  // Sexta
          case 6: return 'gozosos';    // Sábado
          default: return 'gloriosos';
        }
      }

      // Estado Global da Aplicação
      let selectedDay = new Date().getDay();
      let activeMode = 'meditativo';
      let meditativoVariant = 'fatima'; // 'montfort' | 'fatima'
      let activeBeadId = 0;
      let completedBeads = new Set();
      let beadsList = [];
      let oracoesAdicionaisEnabled = localStorage.getItem('oracoesAdicionais') === 'true';

      // Sequência completa de contas litúrgicas
      function createBeads() {
        const list = [];
        let index = 0;

        // Abertura
        list.push({ id: index++, type: 'oferecimento' });

        // Introdução
        list.push({ id: index++, type: 'cruz' });
        list.push({ id: index++, type: 'pai-nosso' });
        list.push({ id: index++, type: 'ave-maria', introIndex: 0 }); // Fé
        list.push({ id: index++, type: 'ave-maria', introIndex: 1 }); // Esperança
        list.push({ id: index++, type: 'ave-maria', introIndex: 2 }); // Caridade

        // 5 Dezenas de Mistérios
        for (let m = 0; m < 5; m++) {
          list.push({ id: index++, type: 'misterio', mysteryIndex: m }); // Mistério / Pai Nosso
          for (let a = 0; a < 10; a++) {
            list.push({ id: index++, type: 'ave-maria', mysteryIndex: m, beadIndex: a });
          }
        }

        // Conclusão
        list.push({ id: index++, type: 'agradecimento' });
        list.push({ id: index++, type: 'salve-rainha' });

        // Orações adicionais (opcionais)
        if (oracoesAdicionaisEnabled) {
          list.push({ id: index++, type: 'espirito-santo' });
          list.push({ id: index++, type: 'sao-jose' });
          list.push({ id: index++, type: 'sao-miguel' });
        }

        return list;
      }

      beadsList = createBeads();

      // Referências de UI
      const beadsContainer = document.getElementById('beadsContainer');
      const panelContent = document.getElementById('panelContent');

      // Gerenciar Estado do Dropdown de Dias
      daySelectorBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !dayDropdown.classList.contains('hidden');
        if (isOpen) {
          closeDropdown();
        } else {
          openDropdown();
        }
      });

      function openDropdown() {
        dayDropdown.classList.remove('hidden');
        chevronIcon.classList.add('rotate-180');
      }

      function closeDropdown() {
        dayDropdown.classList.add('hidden');
        chevronIcon.classList.remove('rotate-180');
      }

      document.addEventListener('click', closeDropdown);

      function renderDayDropdown() {
        dayDropdown.innerHTML = '';
        DAYS_OF_WEEK.forEach((day, idx) => {
          const mSetId = getMysterySetIdForDay(idx);
          const mSetName = MYSTERY_SETS[mSetId].name.replace('Mistérios ', '');
          const isSelected = selectedDay === idx;
          
          const optionBtn = document.createElement('button');
          optionBtn.className = `text-left px-4 py-2.5 rounded-xl transition-colors font-serif text-sm ${
            isSelected ? 'bg-orange-50 text-orange-950 font-medium' : 'text-stone-600 hover:bg-stone-50'
          }`;
          optionBtn.innerHTML = `
            <div>${day}</div>
            <span class="block text-[10px] uppercase tracking-widest text-orange-400/80 mt-0.5">${mSetName}</span>
          `;
          optionBtn.addEventListener('click', () => {
            selectedDay = idx;
            currentDayLabel.innerText = day;
            renderPanel();
            renderDayDropdown();
            closeDropdown();
          });
          dayDropdown.appendChild(optionBtn);
        });
      }

      currentDayLabel.innerText = DAYS_OF_WEEK[selectedDay];
      renderDayDropdown();

      // Mudança de Abas / Modos
      function setMode(mode) {
        activeMode = mode;
        const indexBtn = ['curta', 'oracao', 'meditativo', 'imagem'].indexOf(mode);
        activeTabBg.style.left = `calc(${indexBtn * 25}% + 1.5px)`;
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
          if (btn.getAttribute('data-mode') === mode) {
            btn.classList.add('text-orange-900');
            btn.classList.remove('text-stone-400', 'hover:text-stone-600');
            const icon = btn.querySelector('svg');
            if (icon) {
              icon.classList.add('text-orange-600/80');
              icon.classList.remove('text-stone-400');
            }
          } else {
            btn.classList.remove('text-orange-900');
            btn.classList.add('text-stone-400', 'hover:text-stone-600');
            const icon = btn.querySelector('svg');
            if (icon) {
              icon.classList.remove('text-orange-600/80');
              icon.classList.add('text-stone-400');
            }
          }
        });

        renderPanel();
      }

      function getPanelKey(beadId) {
        const bead = beadsList[beadId];
        const isMystery = bead.mysteryIndex !== undefined;
        if ((activeMode === 'imagem' || activeMode === 'curta') && isMystery) {
          return activeMode + ':' + bead.mysteryIndex;
        }
        if (activeMode === 'meditativo') {
          if (bead.type === 'ave-maria' && bead.introIndex !== undefined)
            return 'meditativo:' + meditativoVariant + ':ave-intro:' + bead.introIndex;
          if (bead.type === 'ave-maria' && isMystery)
            return meditativoVariant === 'fatima'
              ? 'meditativo:fatima:ave:' + bead.mysteryIndex
              : 'meditativo:' + meditativoVariant + ':ave:' + bead.mysteryIndex + ':' + bead.beadIndex;
          if (bead.type === 'misterio' && isMystery)
            return 'meditativo:' + meditativoVariant + ':misterio:' + bead.mysteryIndex;
        }
        if (bead.type === 'pai-nosso' || bead.type === 'misterio') return 'fallback:pai-nosso';
        return 'fallback:' + bead.type;
      }

      // Gerar/atualizar contas com transições suaves (DOM diff, sem limpar innerHTML)
      function renderBeads(swipeDx, instant, previewId) {
        swipeDx  = swipeDx  || 0;
        instant  = instant  || false;
        var SIDE      = 4;
        var MAX_CURVE = 11;
        var STEP      = 38;
        var PN_EXTRA  = 42;  // 3× espaço extra ao redor das contas Pai Nosso
        var EASE      = 'transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.25s ease';

        // previewId: conta mostrada no centro durante arrasto (undefined → activeBeadId)
        var centerId  = (previewId !== undefined) ? previewId : activeBeadId;
        var activeIdx = beadsList.findIndex(function(b) { return b.id === centerId; });
        var startIdx  = Math.max(0, activeIdx - SIDE);
        var endIdx    = Math.min(beadsList.length - 1, activeIdx + SIDE);

        function beadSize(type) {
          return type === 'cruz' ? 36 : (type === 'pai-nosso' || type === 'misterio' || type === 'oferecimento') ? 30 : 26;
        }

        function gapBetween(a, b) {
          var ta = beadsList[a] && beadsList[a].type;
          var tb = beadsList[b] && beadsList[b].type;
          var isPn = ta === 'pai-nosso' || ta === 'misterio' || tb === 'pai-nosso' || tb === 'misterio'
                  || ta === 'oferecimento' || tb === 'oferecimento';
          return STEP + (isPn ? PN_EXTRA : 0);
        }

        function xPos(i) {
          if (i === activeIdx) return 0;
          var x = 0;
          if (i > activeIdx) {
            for (var k = activeIdx; k < i; k++) x += gapBetween(k, k + 1);
          } else {
            for (var k = activeIdx; k > i; k--) x -= gapBetween(k - 1, k);
          }
          return x;
        }

        function calcPos(i) {
          var r = i - activeIdx;
          var d = Math.abs(r);
          return {
            r: r,
            x: xPos(i),
            y: -MAX_CURVE * Math.cos(r * Math.PI / (2 * SIDE)),
            s: (i === activeIdx) ? 1.12 : Math.max(0.7, 1 - d * 0.07),
            o: Math.max(0.2, 1 - d * 0.18)
          };
        }

        // Remover contas que saíram da janela
        var newSet = new Set();
        for (var k = startIdx; k <= endIdx; k++) newSet.add(k);
        Array.from(beadsContainer.querySelectorAll('.bw')).forEach(function(w) {
          if (!newSet.has(parseInt(w.getAttribute('data-wi')))) beadsContainer.removeChild(w);
        });

        // Remover fios antigos (recriados a cada render)
        Array.from(beadsContainer.querySelectorAll('.bt')).forEach(function(t) {
          beadsContainer.removeChild(t);
        });

        // Atualizar ou criar contas visíveis
        for (var idx = startIdx; idx <= endIdx; idx++) {
          var bead        = beadsList[idx];
          var p           = calcPos(idx);
          var isCompleted = completedBeads.has(bead.id);
          var isActive    = centerId === bead.id;
          var isCruz      = bead.type === 'cruz';
          var sz          = beadSize(bead.type);
          var tfm         = 'translate(' + (p.x + swipeDx) + 'px,' + p.y + 'px) scale(' + p.s + ')';

          var existingWrap = beadsContainer.querySelector('[data-wi="' + idx + '"]');
          var b;

          if (existingWrap) {
            // Conta já existe: só anima para a nova posição
            b = existingWrap.querySelector('.bb');
            b.style.transition = instant ? 'none' : EASE;
            b.style.transform  = tfm;
            b.style.opacity    = String(p.o);
          } else {
            // Nova conta: criar e posicionar diretamente (sem animação de entrada)
            var wrap = document.createElement('div');
            wrap.className = 'bw';
            wrap.setAttribute('data-wi', String(idx));
            wrap.style.position   = 'absolute';
            wrap.style.left       = '50%';
            wrap.style.top        = '50%';
            wrap.style.marginLeft = (-sz / 2) + 'px';
            wrap.style.marginTop  = (-sz / 2) + 'px';
            wrap.style.width      = sz + 'px';
            wrap.style.height     = sz + 'px';

            b = document.createElement('div');
            b.className          = 'bb';
            b.setAttribute('data-id', String(bead.id));
            b.style.width            = sz + 'px';
            b.style.height           = sz + 'px';
            b.style.cursor           = 'pointer';
            b.style.touchAction      = 'none';
            b.style.userSelect       = 'none';
            b.style.webkitUserSelect = 'none';
            b.style.borderRadius     = isCruz ? '0' : '50%';

            if (isCruz) {
              b.style.background = 'transparent';
              b.style.border     = 'none';
              var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
              svg.setAttribute('viewBox', '0 0 36 36');
              svg.style.cssText = 'width:100%;height:100%;display:block;overflow:visible;pointer-events:none;';
              // Cruz como traços com pontas arredondadas — sem sobreposição
              var cr = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              cr.setAttribute('d', 'M18 3 L18 33 M4 13 L32 13');
              cr.setAttribute('stroke', 'currentColor');
              cr.setAttribute('stroke-width', '7');
              cr.setAttribute('stroke-linecap', 'round');
              cr.setAttribute('fill', 'none');
              svg.appendChild(cr);
              b.appendChild(svg);
            }
            b.style.transform        = tfm;
            b.style.opacity          = String(p.o);

            wrap.appendChild(b);
            beadsContainer.appendChild(wrap);

            ;(function(beadCopy, bEl) {
              var sx = 0, sy = 0;
              bEl.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                sx = e.clientX; sy = e.clientY;
                if (navigator.vibrate) try { navigator.vibrate(8); } catch(er) {}
              });
              bEl.addEventListener('pointerup', function(e) {
                if (Math.sqrt(Math.pow(e.clientX-sx,2)+Math.pow(e.clientY-sy,2)) > 14) return;
                if (activeBeadId === beadCopy.id) {
                  toggleBead(beadCopy.id);
                } else {
                  const prevKey = getPanelKey(activeBeadId);
                  activeBeadId = beadCopy.id;
                  renderBeads();
                  if (getPanelKey(activeBeadId) !== prevKey) renderPanel();
                }
              });
            })(bead, b);
          }

          // Cores (aplicadas sempre para refletir mudança de estado)
          if (isCruz) {
            b.style.color        = isCompleted ? 'rgba(234,88,12,0.30)' : isActive ? '#ea580c' : '#fb923c';
            b.style.borderRadius = isActive ? '50%' : '0';
            b.style.boxShadow    = isActive ? '0 0 0 5px rgba(234,88,12,0.18)' : 'none';
          } else if (isCompleted) {
            b.style.background = 'rgba(234,88,12,0.14)';
            b.style.border     = '1.5px solid rgba(234,88,12,0.28)';
            b.style.boxShadow  = 'none';
          } else if (isActive) {
            b.style.background = '#ea580c';
            b.style.border     = '2px solid transparent';
            b.style.boxShadow  = '0 0 0 5px rgba(234,88,12,0.18)';
          } else {
            b.style.background = '#fb923c';
            b.style.border     = '2px solid transparent';
            b.style.boxShadow  = 'none';
          }

          // Recriar fio antes desta conta (largura = gap entre bordas das contas)
          if (idx > startIdx) {
            var pp    = calcPos(idx - 1);
            var beadSz = (beadSize(beadsList[idx - 1].type) + beadSize(bead.type)) / 2;
            var gap   = gapBetween(idx - 1, idx);
            var tw    = Math.max(2, gap - beadSz);
            var cx2   = (p.x + pp.x) / 2 + swipeDx;
            var cy2   = (p.y + pp.y) / 2;
            var angle = Math.atan2(p.y - pp.y, p.x - pp.x) * 180 / Math.PI;

            var thread = document.createElement('div');
            thread.className           = 'bt';
            thread.style.position      = 'absolute';
            thread.style.left          = '50%';
            thread.style.top           = '50%';
            thread.style.width         = tw + 'px';
            thread.style.height        = '1.5px';
            thread.style.background    = 'rgba(234,88,12,0.38)';
            thread.style.borderRadius  = '1px';
            thread.style.pointerEvents = 'none';
            thread.style.transform     = 'translate(' + (cx2 - tw / 2) + 'px,' + (cy2 - 0.75) + 'px) rotate(' + angle + 'deg)';
            thread.style.transformOrigin = '50% 50%';
            beadsContainer.appendChild(thread);
          }
        }

        pBarFill.style.width = (completedBeads.size / beadsList.length * 100) + '%';
      }

      function toggleBead(id) {
        if (completedBeads.has(id)) {
          completedBeads.delete(id);
        } else {
          completedBeads.add(id);
          if (navigator.vibrate) {
            try { navigator.vibrate([30, 50, 30]); } catch(err) {}
          }
        }

        // Avanço automático com discreto intervalo visual agradável
        if (id === activeBeadId && id < beadsList.length - 1) {
          setTimeout(() => {
            const prevKey = getPanelKey(activeBeadId);
            activeBeadId = id + 1;
            renderBeads();
            if (getPanelKey(activeBeadId) !== prevKey) renderPanel();
            centerBead(activeBeadId);
          }, 250);
        } else {
          renderBeads();
        }
      }

      function centerBead(id) { /* no-op */ }

      // Navegação tipo roleta: arrasto livre + tap esquerdo/direito
      function addSwipeNavigation() {
        var STEP     = 38;
        var PN_EXTRA = 42; // deve bater com renderBeads

        function gap(a, b) {
          var ta = beadsList[a] && beadsList[a].type;
          var tb = beadsList[b] && beadsList[b].type;
          var isPn = ta === 'pai-nosso' || ta === 'misterio' || tb === 'pai-nosso' || tb === 'misterio'
                  || ta === 'oferecimento' || tb === 'oferecimento';
          return STEP + (isPn ? PN_EXTRA : 0);
        }

        // Listener no wrapper pai — cobre o papel E o terço (z-index não bloqueia eventos touch)
        var el      = document.getElementById('mainWrapper');
        var panel   = document.getElementById('mainContent');
        var startX = 0, startY = 0, startT = 0;
        var lastX = 0, lastT = 0;
        var touchTarget = null;
        var velocityX = 0;
        var dragging = false;
        var anchorIdx   = 0;
        var previewIdx  = 0;
        var prevPrevIdx = 0;

        el.addEventListener('touchstart', function(e) {
          startX = lastX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          startT = lastT = Date.now();
          touchTarget = e.target;
          dragging = false;
          velocityX = 0;
          anchorIdx = beadsList.findIndex(function(b) { return b.id === activeBeadId; });
          previewIdx = prevPrevIdx = anchorIdx;
          panel.style.transition = '';
        }, { passive: true });

        el.addEventListener('touchmove', function(e) {
          var cx = e.touches[0].clientX;
          var cy = e.touches[0].clientY;
          var dx = cx - startX;
          var dy = cy - startY;

          if (!dragging) {
            if (Math.abs(dx) < 8) return;
            if (Math.abs(dy) > Math.abs(dx) * 0.8) return;
            dragging = true;
          }

          var now = Date.now();
          velocityX = (cx - lastX) / Math.max(1, now - lastT);
          lastX = cx;
          lastT = now;

          var cur = anchorIdx;
          var rem = dx;

          while (rem < 0 && cur < beadsList.length - 1) {
            var g = gap(cur, cur + 1);
            if (-rem >= g) { rem += g; cur++; } else break;
          }
          while (rem > 0 && cur > 0) {
            var g = gap(cur - 1, cur);
            if (rem >= g) { rem -= g; cur--; } else break;
          }

          previewIdx = cur;

          var offset = rem;
          if (cur === 0 && rem > 0) offset = rem * 0.25;
          if (cur === beadsList.length - 1 && rem < 0) offset = rem * 0.25;

          if (cur !== prevPrevIdx) {
            if (navigator.vibrate) try { navigator.vibrate(5); } catch(er) {}
            prevPrevIdx = cur;
          }

          renderBeads(offset, true, beadsList[cur].id);
          panel.style.transform = 'translateX(' + (offset * 0.1) + 'px)';
        }, { passive: true });

        function navigate(idx) {
          var newId = beadsList[idx].id;
          if (newId === activeBeadId) return;
          const prevKey = getPanelKey(activeBeadId);
          activeBeadId = newId;
          if (navigator.vibrate) try { navigator.vibrate(10); } catch(er) {}
          renderBeads(0, false);
          if (getPanelKey(activeBeadId) !== prevKey) renderPanel();
        }

        function onEnd(e) {
          var endX = e.changedTouches ? e.changedTouches[0].clientX : lastX;
          var endY = e.changedTouches ? e.changedTouches[0].clientY : startY;
          var totalDx = Math.abs(endX - startX);
          var totalDy = Math.abs(endY - startY);
          var elapsed = Date.now() - startT;

          // Tap: movimento pequeno e toque curto, fora de uma conta individual
          var isTap = !dragging && totalDx < 10 && totalDy < 10 && elapsed < 400;
          if (isTap && !(touchTarget && touchTarget.closest('.bw'))) {
            var curIdx = beadsList.findIndex(function(b) { return b.id === activeBeadId; });
            if (endX < window.innerWidth / 2) {
              if (curIdx > 0) navigate(curIdx - 1);
            } else {
              if (curIdx < beadsList.length - 1) navigate(curIdx + 1);
            }
            return;
          }

          if (!dragging) return;
          dragging = false;

          var finalIdx = previewIdx;
          if (velocityX < -0.5 && finalIdx < beadsList.length - 1) finalIdx++;
          if (velocityX >  0.5 && finalIdx > 0) finalIdx--;

          panel.style.transition = 'transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94)';
          panel.style.transform  = '';
          setTimeout(function() { panel.style.transition = ''; }, 300);

          var newId = beadsList[finalIdx].id;
          if (newId !== activeBeadId) {
            const prevKey = getPanelKey(activeBeadId);
            activeBeadId = newId;
            if (navigator.vibrate) try { navigator.vibrate(10); } catch(er) {}
            if (getPanelKey(activeBeadId) !== prevKey) renderPanel();
          }
          renderBeads(0, false);
        }

        el.addEventListener('touchend',    onEnd, { passive: true });
        el.addEventListener('touchcancel', onEnd, { passive: true });
      }

      function openMeditativoSelector() {
        const overlay = document.getElementById('meditativoSelectorOverlay');
        const sheet = document.getElementById('meditativoSelectorSheet');
        overlay.style.display = 'flex';
        updateMeditativoSelectorButtons();
        requestAnimationFrame(() => {
          sheet.style.transition = 'transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94)';
          sheet.style.transform = 'translateY(0)';
        });
      }

      function closeMeditativoSelector() {
        const overlay = document.getElementById('meditativoSelectorOverlay');
        const sheet = document.getElementById('meditativoSelectorSheet');
        sheet.style.transition = 'transform 0.3s cubic-bezier(0.55,0,1,0.45)';
        sheet.style.transform = 'translateY(100%)';
        setTimeout(() => { overlay.style.display = 'none'; }, 310);
      }

      function selectMeditativoVariant(variant) {
        meditativoVariant = variant;
        const badge = document.getElementById('montfortBadge');
        if (badge) badge.classList.toggle('hidden', variant !== 'montfort');
        const fatimaBadge = document.getElementById('fatimaBadge');

      function updateMeditativoSelectorButtons() {
        const btns = [
          { el: document.getElementById('btnMeditativoMontfort'), variant: 'montfort' },
          { el: document.getElementById('btnMeditativoFatima'),   variant: 'fatima'   }
        ];
        btns.forEach(({ el, variant }) => {
          if (!el) return;
          if (meditativoVariant === variant) {
            el.classList.add('border-orange-300', 'bg-orange-50/50');
            el.classList.remove('border-stone-100', 'bg-transparent');
          } else {
            el.classList.remove('border-orange-300', 'bg-orange-50/50');
            el.classList.add('border-stone-100');
          }
        });
      }

      setMode('meditativo');
      renderBeads();
      addSwipeNavigation();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }

      // Pull-to-refresh: arrasta pra baixo a partir do topo → pílula → reload
      (function () {
        const ptr = document.getElementById('ptr');
        const spinner = document.getElementById('ptr-spinner');
        let startY = 0;
        let startInHeader = false;
        let triggered = false;

        document.addEventListener('touchstart', e => {
          startY = e.touches[0].clientY;
          startInHeader = startY < 72; // só ativa se o toque começar na área do cabeçalho
          triggered = false;
        }, { passive: true });

        document.addEventListener('touchmove', e => {
          if (!startInHeader || triggered) return;
          const dy = e.touches[0].clientY - startY; // positivo = deslizou pra baixo
          if (dy > 55) {
            triggered = true;
            ptr.style.transition = 'none';
            ptr.style.opacity = '1';
            ptr.style.transform = 'translate(-50%, -60px)';
            // Pequena animação de entrada
            requestAnimationFrame(() => {
              ptr.style.transition = '';
              ptr.classList.add('ptr-show');
              spinner.classList.add('spinning');
            });
            // Força update do service worker + reload
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistration().then(reg => {
                if (reg) reg.update();
              });
            }
            setTimeout(() => window.location.reload(true), 1400);
          }
        }, { passive: true });
      })();

      // --- Menu de Configurações ---
      function openSettingsMenu() {
        const overlay = document.getElementById('settingsOverlay');
        const sheet = document.getElementById('settingsSheet');
        overlay.style.display = 'flex';
        updateSettingsToggleUI();
        requestAnimationFrame(() => {
          sheet.style.transition = 'transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94)';
          sheet.style.transform = 'translateY(0)';
        });
      }

      function closeSettingsMenu() {
        const overlay = document.getElementById('settingsOverlay');
        const sheet = document.getElementById('settingsSheet');
        sheet.style.transition = 'transform 0.3s cubic-bezier(0.55,0,1,0.45)';
        sheet.style.transform = 'translateY(100%)';
        setTimeout(() => { overlay.style.display = 'none'; }, 310);
      }

      function toggleOracoesAdicionais() {
        oracoesAdicionaisEnabled = !oracoesAdicionaisEnabled;
        localStorage.setItem('oracoesAdicionais', oracoesAdicionaisEnabled ? 'true' : 'false');
        updateSettingsToggleUI();
        // Recria as contas e volta para a primeira
        beadsList = createBeads();
        activeBeadId = 0;
        completedBeads = new Set();
        renderBeads(0, true);
        renderPanel();
      }

      function openPrayer(key) {
        const prayer = COMMON_PRAYERS[key];
        if (!prayer) return;
        document.getElementById('prayerReaderTitle').textContent = prayer.title;
        document.getElementById('prayerReaderText').textContent = prayer.text;
        const overlay = document.getElementById('prayerReaderOverlay');
        const sheet = document.getElementById('prayerReaderSheet');
        overlay.style.display = 'flex';
        requestAnimationFrame(() => {
          sheet.style.transition = 'transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94)';
          sheet.style.transform = 'translateY(0)';
        });
      }

      function closePrayerReader() {
        const overlay = document.getElementById('prayerReaderOverlay');
        const sheet = document.getElementById('prayerReaderSheet');
        sheet.style.transition = 'transform 0.3s cubic-bezier(0.55,0,1,0.45)';
        sheet.style.transform = 'translateY(100%)';
        setTimeout(() => { overlay.style.display = 'none'; }, 310);
      }

      function updateSettingsToggleUI() {
        const btn = document.getElementById('toggleOracoesAdicionais');
        const knob = document.getElementById('toggleKnob');
        if (!btn || !knob) return;
        if (oracoesAdicionaisEnabled) {
          btn.style.background = '#D97706';
          btn.setAttribute('aria-checked', 'true');
          knob.style.transform = 'translateX(20px)';
        } else {
          btn.style.background = '#D1C9BD';
          btn.setAttribute('aria-checked', 'false');
          knob.style.transform = 'translateX(0)';
        }
      }
