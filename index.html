    <style>
      body {
        background-color: #EFECE6;
        color: #292524;
        -webkit-tap-highlight-color: transparent;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .clip-cross {
        clip-path: polygon(
          35% 0%, 65% 0%, 65% 30%, 
          100% 30%, 100% 50%, 65% 50%, 
          65% 100%, 35% 100%, 35% 50%, 
          0% 50%, 0% 30%, 35% 30%
        );

        user-select: none;
        -webkit-user-select: none;

      /* Transição de transição suave do painel de leitura */
      .fade-transition {
        transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
      }
      .fade-out {
        opacity: 0;
        transform: translateY(-8px);
        filter: blur(2px);
      }
      .fade-in {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
      @keyframes ptr-spin {
        to { transform: rotate(360deg); }
      }
      #ptr {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translate(-50%, -60px);
        opacity: 0;
        z-index: 200;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      #ptr.ptr-show {
        transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
        transform: translate(-50%, 16px);
        opacity: 1;
      }
      #ptr-ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #f97316;
        box-shadow: 0 4px 14px rgba(249,115,22,0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #ptr-spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255,255,255,0.35);
        border-top-color: white;
        border-radius: 50%;
      }
      #ptr-spinner.spinning {
        animation: ptr-spin 0.7s linear infinite;
      }

          text: 'Ave Maria, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós pecadores, agora e na hora da nossa morte. Amém.'
        },
        'salve-rainha': {
          title: 'Salve Rainha',
          text: 'Salve Rainha, Mãe de misericórdia, vida, doçura e esperança nossa, salve! A vós bradamos, os degredados filhos de Eva; a vós suspiramos, gemendo e chorando neste vale de lágrimas. Eia, pois, advogada nossa, esses vossos olhos misericordiosos a nós volvei; e depois deste desterro nos mostrai Jesus, bendito fruto do vosso ventre, ó clemente, ó piedosa, ó doce sempre Virgem Maria. Rogai por nós, Santa Mãe de Deus, para que sejamos dignos das promessas de Cristo. Amém.'
        }
      };

      function getMysterySetIdForDay(dayIndex) {
        switch (dayIndex) {
          case 0: return 'gloriosos'; // Domingo
          case 1: return 'gozosos';    // Segunda
          case 2: return 'dolorosos';  // Terça
          case 3: return 'gloriosos';  // Quarta
          case 4: return 'luminosos';  // Quinta
          case 5: return 'dolorosos';  // Sexta
          case 6: return 'gozosos';    // Sábado
          default: return 'gloriosos';
        }
      }

      // Estado Global da Aplicação
      let selectedDay = new Date().getDay();
      let activeMode = 'meditativo';
      let activeBeadId = 0;
      let completedBeads = new Set();
      let beadsList = [];

      // Sequência exata de 61 contas litúrgicas
      function createBeads() {
        const list = [];
        let index = 0;

        // Introdução
        list.push({ id: index++, type: 'cruz' });
        list.push({ id: index++, type: 'pai-nosso' });
        list.push({ id: index++, type: 'ave-maria' }); // Fé
        list.push({ id: index++, type: 'ave-maria' }); // Esperança
        list.push({ id: index++, type: 'ave-maria' }); // Caridade

        // 5 Dezenas de Mistérios
        for (let m = 0; m < 5; m++) {
          list.push({ id: index++, type: 'misterio', mysteryIndex: m }); // Mistério / Pai Nosso
          for (let a = 0; a < 10; a++) {
            list.push({ id: index++, type: 'ave-maria', mysteryIndex: m, beadIndex: a });
          }
        }

        // Conclusão
        list.push({ id: index++, type: 'salve-rainha' });

        return list;
      }

      beadsList = createBeads();

      // Referências de UI
      const beadsContainer = document.getElementById('beadsContainer');
      const panelContent = document.getElementById('panelContent');
      const currentDayLabel = document.getElementById('currentDayLabel');
      const dayDropdown = document.getElementById('dayDropdown');
      const daySelectorBtn = document.getElementById('daySelectorBtn');
      const chevronIcon = document.getElementById('chevronIcon');
      const activeTabBg = document.getElementById('activeTabBg');
      const pBarFill = document.getElementById('pBarFill');

      // Gerenciar Estado do Dropdown de Dias
      daySelectorBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !dayDropdown.classList.contains('hidden');
        if (isOpen) {
          closeDropdown();
        } else {
          openDropdown();
        }
      });

      function openDropdown() {
        dayDropdown.classList.remove('hidden');
        chevronIcon.classList.add('rotate-180');
      }

      function closeDropdown() {
        dayDropdown.classList.add('hidden');
        chevronIcon.classList.remove('rotate-180');
      }

      document.addEventListener('click', closeDropdown);

      function renderDayDropdown() {
        dayDropdown.innerHTML = '';
        DAYS_OF_WEEK.forEach((day, idx) => {
          const mSetId = getMysterySetIdForDay(idx);
          const mSetName = MYSTERY_SETS[mSetId].name.replace('Mistérios ', '');
          const isSelected = selectedDay === idx;
          
          const optionBtn = document.createElement('button');
          optionBtn.className = `text-left px-4 py-2.5 rounded-xl transition-colors font-serif text-sm ${
            isSelected ? 'bg-orange-50 text-orange-950 font-medium' : 'text-stone-600 hover:bg-stone-50'
          }`;
          optionBtn.innerHTML = `
            <div>${day}</div>
            <span class="block text-[10px] uppercase tracking-widest text-orange-400/80 mt-0.5">${mSetName}</span>
          `;
          optionBtn.addEventListener('click', () => {
            selectedDay = idx;
            currentDayLabel.innerText = day;
            renderPanel();
            renderDayDropdown();
            closeDropdown();
          });
          dayDropdown.appendChild(optionBtn);
        });
      }

      currentDayLabel.innerText = DAYS_OF_WEEK[selectedDay];
      renderDayDropdown();

      // Mudança de Abas / Modos
      function setMode(mode) {
        activeMode = mode;
        const indexBtn = ['curta', 'oracao', 'meditativo', 'imagem'].indexOf(mode);
        activeTabBg.style.left = `calc(${indexBtn * 25}% + 1.5px)`;
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
          if (btn.getAttribute('data-mode') === mode) {
            btn.classList.add('text-orange-900');
            btn.classList.remove('text-stone-400', 'hover:text-stone-600');
            const icon = btn.querySelector('svg');
            if (icon) {
              icon.classList.add('text-orange-600/80');
              icon.classList.remove('text-stone-400');
            }
          } else {
            btn.classList.remove('text-orange-900');
            btn.classList.add('text-stone-400', 'hover:text-stone-600');
            const icon = btn.querySelector('svg');
            if (icon) {
              icon.classList.remove('text-orange-600/80');
              icon.classList.add('text-stone-400');
            }
          }
        });

        renderPanel();
      }

      // Renderizar Painel Devocional Central
      function renderPanel() {
        panelContent.classList.add('fade-out');
        panelContent.classList.remove('fade-in');

        setTimeout(() => {
          const mSet = MYSTERY_SETS[getMysterySetIdForDay(selectedDay)];
          const bead = beadsList[activeBeadId];
          const isMystery = bead.mysteryIndex !== undefined;
          const mystery = isMystery ? mSet.mysteries[bead.mysteryIndex] : null;
          const fruit = (isMystery) ? mSet.fruits[bead.mysteryIndex] : '';

          let layout = '';

          if (activeMode === 'imagem' && isMystery && mystery) {
            layout = `
              <div class="flex flex-col items-center justify-between w-full h-full py-8 text-center">
                <div class="flex flex-col items-center space-y-1">
                  <span class="text-[10px] tracking-[0.25em] uppercase text-orange-950/60 font-serif">
                    Mistério ${bead.mysteryIndex + 1}
                  </span>
                  <div class="text-orange-600/30 text-[9px] tracking-widest font-serif">✧  ✧  ✧</div>
                </div>

                <div class="relative w-full max-w-xs aspect-[4/5] rounded-sm p-2 bg-stone-100/50 border border-orange-200/40 shadow-inner flex items-center justify-center my-4 overflow-hidden">
                  <div class="absolute inset-4 border border-orange-950/10 z-20 pointer-events-none"></div>
                  <span class="absolute top-5 left-5 text-orange-950/30 font-serif text-[10px] select-none z-20">+</span>
                  <span class="absolute top-5 right-5 text-orange-950/30 font-serif text-[10px] select-none z-20">+</span>
                  <span class="absolute bottom-5 left-5 text-orange-950/30 font-serif text-[10px] select-none z-20">+</span>
                  <span class="absolute bottom-5 right-5 text-orange-950/30 font-serif text-[10px] select-none z-20">+</span>

                  <img 
                    src="${mystery.imageUrl}" 
                    alt="${mystery.title}" 
                    class="w-full h-full object-cover grayscale-[20%] opacity-90 brightness-[0.98] contrast-[1.02]"
                    referrerpolicy="no-referrer"
                  />
                </div>

                <div class="flex flex-col items-center space-y-1">
                  <h3 class="text-base font-serif font-medium text-orange-950 tracking-wide">
                    ${mystery.title}
                  </h3>
                  ${fruit ? `<span class="text-[11px] font-serif tracking-wider text-orange-850/70 italic">Fruto — ${fruit}</span>` : ''}
                </div>
              </div>
            `;
          } else if (activeMode === 'curta' && isMystery && mystery) {
            layout = `
              <div class="flex flex-col items-center justify-between w-full h-full py-10 text-center">
                <div class="flex flex-col items-center space-y-2">
                  <span class="text-[9px] tracking-[0.3em] uppercase text-orange-950/50 font-serif font-semibold">
                    ${mSet.name}
                  </span>
                  <h4 class="text-xs font-serif italic tracking-wide text-orange-600/85">
                    ${bead.mysteryIndex + 1}º Mistério
                  </h4>
                  <div class="text-orange-600/30 text-[9px] tracking-widest font-serif">✥  ✥  ✥</div>
                </div>

                <div class="w-full my-auto space-y-6 px-4">
                  <h3 class="text-2xl font-serif text-orange-950 font-medium leading-snug tracking-wide">
                    ${mystery.title}
                  </h3>
                  ${fruit ? `<div class="text-[11px] uppercase tracking-[0.2em] text-orange-800/80 font-serif">Fruto — <span class="font-semibold italic lowercase first-letter:uppercase">${fruit}</span></div>` : ''}
                  <div class="w-16 h-px bg-gradient-to-r from-transparent via-orange-300/40 to-transparent mx-auto my-4"></div>
                  <p class="text-base text-stone-600 font-serif font-light leading-relaxed italic">
                    "${mystery.curta}"
                  </p>
                </div>

                <div class="text-[9px] text-stone-400 font-serif tracking-[0.3em] uppercase">
                  Sagrada Escritura
                </div>
              </div>
            `;
          } else if (activeMode === 'meditativo' && isMystery && mystery && bead.type === 'ave-maria') {
            layout = `
              <div class="flex flex-col items-center justify-between w-full h-full py-10 text-center">
                <div class="flex flex-col items-center space-y-1">
                  <span class="text-[9px] tracking-[0.25em] uppercase text-orange-955/55 font-serif">
                    ${mystery.title}
                  </span>
                  <h4 class="text-xs font-serif italic tracking-wide text-orange-600/80 font-medium">
                    ${bead.beadIndex + 1}ª Ave Maria
                  </h4>
                  <div class="text-orange-600/20 text-[9px] tracking-widest font-serif">✧  ✧  ✧</div>
                </div>

                <div class="w-full my-auto space-y-6 px-4">
                  <span class="text-[10px] uppercase tracking-[0.2em] text-orange-700/60 font-semibold block">
                    ${bead.beadIndex + 1}ª Dezena
                  </span>
                  <h3 class="text-xl font-serif font-light text-stone-800 leading-relaxed">
                    ${mystery.meditativo[bead.beadIndex]}
                  </h3>
                </div>

                <div class="w-1.5 h-1.5 rounded-full border border-orange-300/40 bg-orange-50"></div>
              </div>
            `;
          } else if (activeMode === 'meditativo' && bead.type === 'misterio' && mystery) {
            layout = `
              <div class="flex flex-col items-center justify-between w-full h-full py-10 text-center">
                <div class="flex flex-col items-center space-y-1">
                  <span class="text-[9px] tracking-[0.25em] uppercase text-orange-955/50 font-serif">
                    ${mSet.name}
                  </span>
                  <div class="text-orange-600/30 text-[9px] tracking-widest font-serif">✥  ✥  ✥</div>
                </div>

                <div class="w-full my-auto space-y-5 px-4">
                  <span class="text-xs uppercase tracking-[0.2em] text-orange-650/70 font-semibold block">
                    Contemplação
                  </span>
                  <h3 class="text-2xl font-serif font-light text-stone-800 leading-snug">
                    ${mystery.title}
                  </h3>
                  ${fruit ? `<div class="text-[11px] italic tracking-wider text-orange-850/70 font-serif">Fruto do Mistério — ${fruit}</div>` : ''}
                  <div class="w-16 h-px bg-gradient-to-r from-transparent via-orange-300/40 to-transparent mx-auto my-4"></div>
                  <p class="text-base text-stone-500 font-serif leading-relaxed">
                    Pai Nosso, em honra e meditação a este santo mistério.
                  </p>
                </div>

                <div class="text-[10px] text-orange-700/60 font-serif tracking-[0.15em] uppercase">
                  Pai Nosso
                </div>
              </div>
            `;
          } else {
            // Layout de Fallback de Orações Completas
            let title = '';
            let content = '';
            let iconHeader = '✦  ✦  ✦';

            if (bead.type === 'cruz') {
              title = COMMON_PRAYERS.cruz.title;
              content = COMMON_PRAYERS.cruz.text;
              iconHeader = '✥  ✥  ✥';
            } else if (bead.type === 'pai-nosso' || bead.type === 'misterio') {
              title = COMMON_PRAYERS['pai-nosso'].title;
              content = COMMON_PRAYERS['pai-nosso'].text;
            } else if (bead.type === 'ave-maria') {
              title = COMMON_PRAYERS['ave-maria'].title;
              content = COMMON_PRAYERS['ave-maria'].text;
            } else if (bead.type === 'salve-rainha') {
              title = COMMON_PRAYERS['salve-rainha'].title;
              content = COMMON_PRAYERS['salve-rainha'].text;
              iconHeader = '✥  ✥  ✥';
            }

            layout = `
              <div class="flex flex-col items-center justify-between w-full h-full py-10 text-center">
                <div class="flex flex-col items-center space-y-1">
                  <span class="text-[9px] tracking-[0.3em] uppercase text-orange-955/40 font-serif">
                    Devocionário
                  </span>
                  <div class="text-orange-600/30 text-[9px] tracking-widest font-serif">${iconHeader}</div>
                </div>

                <div class="w-full my-auto space-y-4 max-h-[58vh] overflow-y-auto hide-scrollbar px-4">
                  ${bead.type === 'misterio' && mystery ? `
                    <div class="mb-4">
                      <span class="text-[10px] uppercase tracking-[0.2em] text-orange-700/60 block">Mistério do Dia</span>
                      <h4 class="text-lg font-serif font-medium text-orange-900/90 leading-snug">${mystery.title}</h4>
                    </div>
                  ` : ''}

                  <h3 class="text-[13px] font-serif text-orange-850 font-medium uppercase tracking-widest mb-4">
                    ${title}
                  </h3>
                  <p class="text-base text-stone-700 font-serif font-light leading-relaxed whitespace-pre-line tracking-wide">
                    ${content}
                  </p>
                </div>

                <div class="text-[10px] text-orange-700/40 font-serif tracking-widest uppercase">
                  Rezar com Devoção
                </div>
              </div>
            `;
          }

          panelContent.innerHTML = layout;
          panelContent.classList.remove('fade-out');
          panelContent.classList.add('fade-in');
        }, 300);
      }

      // Gerar/atualizar contas com transições suaves (DOM diff, sem limpar innerHTML)
      function renderBeads() {
        var SIDE      = 4;
        var MAX_CURVE = 11;  // px de arco vertical no centro
        var STEP      = 38;  // px entre centros de contas (horizontal)
        var EASE      = 'transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.25s ease';

        var activeIdx = beadsList.findIndex(function(b) { return b.id === activeBeadId; });
        var startIdx  = Math.max(0, activeIdx - SIDE);
        var endIdx    = Math.min(beadsList.length - 1, activeIdx + SIDE);

        function calcPos(i) {
          var r = i - activeIdx;
          var d = Math.abs(r);
          return {
            r: r,
            x: r * STEP,
            y: -MAX_CURVE * Math.cos(r * Math.PI / (2 * SIDE)),
            s: (i === activeIdx) ? 1.12 : Math.max(0.7, 1 - d * 0.07),
            o: Math.max(0.2, 1 - d * 0.18)
          };
        }

        // Remover contas que saíram da janela
        var newSet = new Set();
        for (var k = startIdx; k <= endIdx; k++) newSet.add(k);
        Array.from(beadsContainer.querySelectorAll('.bw')).forEach(function(w) {
          if (!newSet.has(parseInt(w.getAttribute('data-wi')))) beadsContainer.removeChild(w);
        });

        // Remover fios antigos (recriados a cada render)
        Array.from(beadsContainer.querySelectorAll('.bt')).forEach(function(t) {
          beadsContainer.removeChild(t);
        });

        // Atualizar ou criar contas visíveis
        for (var idx = startIdx; idx <= endIdx; idx++) {
          var bead        = beadsList[idx];
          var p           = calcPos(idx);
          var isCompleted = completedBeads.has(bead.id);
          var isActive    = activeBeadId === bead.id;
          var isCruz      = bead.type === 'cruz';
          var sz          = isCruz ? 36 : 26;
          var tfm         = 'translate(' + p.x + 'px,' + p.y + 'px) scale(' + p.s + ')';

          var existingWrap = beadsContainer.querySelector('[data-wi="' + idx + '"]');
          var b;

          if (existingWrap) {
            // Conta já existe: só anima para a nova posição
            b = existingWrap.querySelector('.bb');
            b.style.transition = EASE;
            b.style.transform  = tfm;
            b.style.opacity    = String(p.o);
          } else {
            // Nova conta: criar e posicionar diretamente (sem animação de entrada)
            var wrap = document.createElement('div');
            wrap.className = 'bw';
            wrap.setAttribute('data-wi', String(idx));
            wrap.style.position   = 'absolute';
            wrap.style.left       = '50%';
            wrap.style.top        = '50%';
            wrap.style.marginLeft = (-sz / 2) + 'px';
            wrap.style.marginTop  = (-sz / 2) + 'px';
            wrap.style.width      = sz + 'px';
            wrap.style.height     = sz + 'px';

            b = document.createElement('div');
            b.className          = 'bb' + (isCruz ? ' clip-cross' : '');
            b.setAttribute('data-id', String(bead.id));
            b.style.width            = sz + 'px';
            b.style.height           = sz + 'px';
            b.style.cursor           = 'pointer';
            b.style.touchAction      = 'none';
            b.style.userSelect       = 'none';
            b.style.webkitUserSelect = 'none';
            b.style.borderRadius     = isCruz ? '0' : '50%';
            b.style.transform        = tfm;
            b.style.opacity          = String(p.o);

            wrap.appendChild(b);
            beadsContainer.appendChild(wrap);

            ;(function(beadCopy, bEl) {
              var sx = 0, sy = 0;
              bEl.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                sx = e.clientX; sy = e.clientY;
                if (navigator.vibrate) try { navigator.vibrate(8); } catch(er) {}
              });
              bEl.addEventListener('pointerup', function(e) {
                if (Math.sqrt(Math.pow(e.clientX-sx,2)+Math.pow(e.clientY-sy,2)) > 14) return;
                if (activeBeadId === beadCopy.id) {
                  toggleBead(beadCopy.id);
                } else {
                  activeBeadId = beadCopy.id;
                  renderBeads(); renderPanel();
                }
              });
            })(bead, b);
          }

          // Cores (aplicadas sempre para refletir mudança de estado)
          if (isCompleted) {
            b.style.background = 'rgba(234,88,12,0.14)';
            b.style.border     = '1.5px solid rgba(234,88,12,0.28)';
            b.style.boxShadow  = 'none';
          } else if (isActive) {
            b.style.background = '#ea580c';
            b.style.border     = '2px solid transparent';
            b.style.boxShadow  = '0 0 0 5px rgba(234,88,12,0.18)';
          } else {
            b.style.background = '#fb923c';
            b.style.border     = '2px solid transparent';
            b.style.boxShadow  = 'none';
          }

          // Recriar fio antes desta conta
          if (idx > startIdx) {
            var pp  = calcPos(idx - 1);
            var isGap = bead.type === 'pai-nosso' || bead.type === 'misterio'
                     || beadsList[idx - 1].type === 'misterio';
            var tw  = isGap ? 20 : 6;
            var tmx = (p.x + pp.x) / 2 - tw / 2;
            var tmy = (p.y + pp.y) / 2 - 0.75;

            var thread = document.createElement('div');
            thread.className          = 'bt';
            thread.style.position     = 'absolute';
            thread.style.left         = '50%';
            thread.style.top          = '50%';
            thread.style.width        = tw + 'px';
            thread.style.height       = '1.5px';
            thread.style.background   = 'rgba(234,88,12,0.38)';
            thread.style.borderRadius = '1px';
            thread.style.transform    = 'translate(' + tmx + 'px,' + tmy + 'px)';
            thread.style.pointerEvents = 'none';
            beadsContainer.appendChild(thread);
          }
        }

        pBarFill.style.width = (completedBeads.size / beadsList.length * 100) + '%';
      }

      function toggleBead(id) {
        if (completedBeads.has(id)) {
          completedBeads.delete(id);
        } else {
          completedBeads.add(id);
          if (navigator.vibrate) {
            try { navigator.vibrate([30, 50, 30]); } catch(err) {}
          }
        }

        // Avanço automático com discreto intervalo visual agradável
        if (id === activeBeadId && id < beadsList.length - 1) {
          setTimeout(() => {
            activeBeadId = id + 1;
            renderBeads();
            renderPanel();
            centerBead(activeBeadId);
          }, 250);
        } else {
          renderBeads();
        }
      }

      function centerBead(id) { /* no-op */ }

      // Swipe no painel: esquerda = avança, direita = volta
      function addSwipeNavigation() {
        var el = document.getElementById('mainContent');
        var startX = 0, startY = 0;

        el.addEventListener('touchstart', function(e) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }, { passive: true });

        el.addEventListener('touchend', function(e) {
          var dx = e.changedTouches[0].clientX - startX;
          var dy = e.changedTouches[0].clientY - startY;
          if (Math.abs(dx) < 44 || Math.abs(dy) > Math.abs(dx) * 0.8) return;

          if (dx < 0) {
            // Swipe esquerda → completa conta ativa e avança
            toggleBead(activeBeadId);
          } else {
            // Swipe direita → volta uma conta (desmarca ambas para poder rezar de novo)
            if (activeBeadId > 0) {
              completedBeads.delete(activeBeadId);
              activeBeadId = activeBeadId - 1;
              completedBeads.delete(activeBeadId);
              if (navigator.vibrate) { try { navigator.vibrate(10); } catch(e) {} }
              renderBeads();
              renderPanel();
            }
          }
        }, { passive: true });
      }

      // Inicializar
      setMode('meditativo');
      renderBeads();
      addSwipeNavigation();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }

      // Pull-to-refresh: arrasta pra cima → bolinha no topo → reload
      (function () {
        const ptr = document.getElementById('ptr');
        const spinner = document.getElementById('ptr-spinner');
        let startY = 0;
        let triggered = false;

        document.addEventListener('touchstart', e => {
          startY = e.touches[0].clientY;
          triggered = false;
        }, { passive: true });

        document.addEventListener('touchmove', e => {
          if (triggered) return;
          const dy = startY - e.touches[0].clientY; // positivo = deslizou pra cima
          if (dy > 40) {
            triggered = true;
            ptr.style.transition = 'none';
            ptr.style.opacity = '1';
            ptr.style.transform = 'translate(-50%, -60px)';
            // Pequena animação de entrada
            requestAnimationFrame(() => {
              ptr.style.transition = '';
              ptr.classList.add('ptr-show');
              spinner.classList.add('spinning');
            });
            // Força update do service worker + reload
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistration().then(reg => {
                if (reg) reg.update();
              });
            }
            setTimeout(() => window.location.reload(true), 1400);
          }
        }, { passive: true });
      })();
    </script>
  </body>
