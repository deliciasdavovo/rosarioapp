<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#EFECE6"/>
  <!-- Cross vertical bar -->
  <rect x="236" y="80" width="40" height="220" rx="8" fill="#92400e"/>
  <!-- Cross horizontal bar -->
  <rect x="156" y="148" width="200" height="40" rx="8" fill="#92400e"/>
  <!-- Rosary circle of beads -->
  <circle cx="256" cy="360" r="90" fill="none" stroke="#92400e" stroke-width="6" stroke-dasharray="18 10"/>
  <!-- Center bead -->
  <circle cx="256" cy="270" r="14" fill="#b45309"/>
  <!-- Decade beads -->
  <circle cx="346" cy="360" r="10" fill="#b45309"/>
  <circle cx="316" cy="433" r="10" fill="#b45309"/>
  <circle cx="256" cy="460" r="10" fill="#b45309"/>
  <circle cx="196" cy="433" r="10" fill="#b45309"/>
  <circle cx="166" cy="360" r="10" fill="#b45309"/>
  <!-- Bottom cross bead -->
  <circle cx="256" cy="470" r="12" fill="#92400e"/>
  <!-- esse text -->
  <text x="256" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#92400e" letter-spacing="4">esse</text>
</svg>
